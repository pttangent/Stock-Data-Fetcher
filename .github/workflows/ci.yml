name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet --disable-pip-version-check --upgrade pip
      - run: pip install --quiet --disable-pip-version-check -e ".[dev]"
      - run: ruff check src tests --output-format=concise
      - run: pytest
