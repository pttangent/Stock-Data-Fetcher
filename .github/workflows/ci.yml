name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet --disable-pip-version-check --upgrade pip
      - run: pip install --quiet --disable-pip-version-check -e ".[dev]"
      - name: Ruff
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ruff check src tests --output-format=concise 2>&1 | tee ruff-report.txt
      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report
          path: ruff-report.txt
      - name: Enforce Ruff result
        if: steps.lint.outcome == 'failure'
        run: exit 1
      - run: pytest
      - name: Package SEC LLM Skill
        if: success()
        shell: bash
        run: |
          zip -r sec-llm-semantic-review-skill.zip .agents/skills/sec-llm-semantic-review
          sha256sum sec-llm-semantic-review-skill.zip > sec-llm-semantic-review-skill.sha256
      - name: Upload SEC LLM Skill
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sec-llm-semantic-review-skill
          path: |
            sec-llm-semantic-review-skill.zip
            sec-llm-semantic-review-skill.sha256
          if-no-files-found: error
