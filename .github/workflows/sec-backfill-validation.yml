name: SEC backfill validation

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/sec-backfill-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/scripts typecheck
      - run: SEC_USER_AGENT="Stock-Data-Fetcher validation@example.com" pnpm --filter @workspace/scripts sec:backfill -- --help
