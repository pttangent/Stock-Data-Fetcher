name: Materialize clean repository

on:
  push:
    branches:
      - agent/equity-semantic-library-clean

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand repository payload
        shell: bash
        run: |
          cat .repo_payload.part* | base64 --decode > /tmp/repo.zip
          rm -rf /tmp/full-repo
          mkdir -p /tmp/full-repo
          unzip -q /tmp/repo.zip -d /tmp/full-repo
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/full-repo/equity-semantic-library/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[materialized] Build clean equity semantic library"
          git push
