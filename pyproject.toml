[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-semantic-library"
version = "0.1.0"
description = "Point-in-time-safe public-equity metadata and SEC filing ingestion into a structured SQLite database."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "pttangent"}]
dependencies = [
  "beautifulsoup4>=4.12",
  "edgartools>=3.0",
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
parquet = ["pandas>=2.2", "pyarrow>=16"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
esl = "equity_semantic_library.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["integration: live network tests; skipped by default"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
